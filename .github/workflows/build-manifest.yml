name: Build Machine Documents manifest

# Rebuilds data.json (the file the web app searches against) any time
# files change on main, plus a daily safety-net run and a manual button.
on:
  push:
    branches: [ main ]
  workflow_dispatch: {}
  schedule:
    - cron: '0 6 * * *'   # 06:00 UTC daily, matches the existing daily upload schedule

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Build data.json
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os

          root = "."
          # Folders/files that should never appear in the manifest.
          SKIP_DIRS = {".git", ".github"}
          KEEP_EXT = {
              ".pdf", ".jpg", ".jpeg", ".png", ".gif", ".bmp",
              ".tiff", ".tif", ".webp", ".heic", ".heif", ".svg", ".ico",
          }

          files = []
          for dirpath, dirnames, filenames in os.walk(root):
              dirnames[:] = [d for d in dirnames if d not in SKIP_DIRS]
              for name in filenames:
                  ext = os.path.splitext(name)[1].lower()
                  if ext not in KEEP_EXT:
                      continue
                  full_path = os.path.join(dirpath, name)
                  rel_path = os.path.relpath(full_path, root).replace(os.sep, "/")
                  mtime = os.path.getmtime(full_path)
                  files.append({"path": rel_path, "modified": int(mtime)})

          # Stable order so diffs/caching behave predictably.
          files.sort(key=lambda f: f["path"].lower())

          with open("data.json", "w", encoding="utf-8") as f:
              json.dump({"files": files, "count": len(files)}, f, ensure_ascii=False)

          print(f"Wrote data.json with {len(files)} file(s).")
          PY

      - name: Commit and push data.json
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --cached --quiet; then
            echo "No changes to data.json — nothing to commit."
          else
            git commit -m "Update data.json manifest"
            git push
          fi
